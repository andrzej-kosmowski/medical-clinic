databaseChangeLog:
  - changeSet:
      id: 007-create-visits-table
      author: Andrzej
      changes:
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_visits_doctor
        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            constraintName: fk_visits_patient