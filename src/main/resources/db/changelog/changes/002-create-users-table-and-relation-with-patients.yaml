databaseChangeLog:
  - changeSet:
      id: 002-create-users-table
      author: Andrzej
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: 003-patient-user-relation
      author: Andrzej
      changes:
        - addColumn:
            tableName: patients
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    unique: true
                    foreignKeyName: fk_patient_users
                    references: users(id)