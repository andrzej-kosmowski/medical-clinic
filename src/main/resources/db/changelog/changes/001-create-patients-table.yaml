databaseChangeLog:
  - changeSet:
      id: 001-create-patients-table
      author: Andrzej
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: id_card_no
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone_number
                  type: VARCHAR(9)
              - column:
                  name: birthday
                  type: DATE
