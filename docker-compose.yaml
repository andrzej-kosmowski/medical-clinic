version: '3'
services:
  medical-clinic:
    container_name: medical-clinic
    image: medical-clinic
    build:
      context: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/medicalclinic
      - LOGSTASH_HOST=logstash
    ports:
      - "8082:8080"
    depends_on:
      - db
    networks:
      - default
      - elk-network
      - medical-network

  db:
    image: postgres
    container_name: medical-clinic-db
    environment:
      - POSTGRES_DB=medicalclinic
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=demo@example.com
      - PGADMIN_DEFAULT_PASSWORD=secret
    ports:
      - "8889:80"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  es_data:
  local_pgdata:
  pgadmin-data:

networks:
  default:
  elk-network:
    external: true
  medical-network:
    external: true